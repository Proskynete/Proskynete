version: 2

# Version updates every 6 months. Security alerts are not affected: GitHub
# raises them as soon as an advisory is published, whatever this schedule says.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: semiannually
    # Minor and patch updates arrive together in one PR. Each major update gets
    # its own PR, so one that breaks the build does not hold back the rest.
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
