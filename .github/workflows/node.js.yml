name: '🚀 Update README.md'

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * mon,wed,fri'

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Check out Git repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🛠 Install Node.js dependencies
        run: npm install

      - name: 🔦 Code Linting
        run: npm run lint

      - name: 🧪 Tests
        run: npm test

  build:
    name: Generate new README.md
    runs-on: ubuntu-latest
    needs: [checks]

    steps:
      - name: 📚 Check out Git repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🛠 Install Node.js dependencies
        run: npm install

      - name: ⚙️ Transpile and generate a new readme file
        env:
          INSTAGRAM_API_KEY: ${{ secrets.INSTAGRAM_API_KEY }}
          # Raises the GitHub API rate limit from 60/hour per IP to 1000/hour.
          # Provided automatically by Actions — no secret to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm start

      - name: 📝 Commit and push changes
        run: |
          git config user.name "Eduardo Álvarez"
          git config user.email "soy@eduardoalvarez.dev"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: [action] Update README with latest info"
          git push origin main
