	<text x="32" y="332" font-style="italic" fill="#EDF4F3">"Si no estás dispuesto a darlo todo, no tienes derecho a intentarlo."</text>

	<text x="32" y="372" font-weight="700" fill="#35D6C0">SOBRE MÍ</text>
	<g fill="#A7BCC4">
		<text x="32" y="394">Soy Eduardo. Llevo más de diez años construyendo aplicaciones web y hoy lidero un equipo de</text>
		<text x="32" y="414">desarrollo. Me interesa cómo usamos la IA sin dejar de entender lo que construimos, y por eso</text>
		<text x="32" y="434">trabajo con Spec-Driven Development. Doy charlas, talleres y cursos, muchos de ellos gratis.</text>
	</g>

